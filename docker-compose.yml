services:
  postgres:
    image: postgres:16-alpine
    container_name: monostarter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: monostarter
    ports:
      # Host port 5433 to avoid colliding with a local (e.g. Homebrew) Postgres
      # already on 5432. Container still listens on 5432 internally.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
